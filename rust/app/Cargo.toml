[package]
name = "telescope-app"
edition.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "telescope-rs"
path = "src/main.rs"

[dependencies]
telescope-core = { path = "../core" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }
qrcode = { version = "0.14", default-features = false }
base64 = "0.22"
serde_json = "1"

[build-dependencies]
slint-build = "1.18"
