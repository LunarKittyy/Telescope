[package]
name = "telescope-app"
description = "telescope-rs: wires every crate together into the desktop app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "telescope-rs"
path = "src/main.rs"

[dependencies]
telescope-core.workspace = true
telescope-link.workspace = true
telescope-media.workspace = true
telescope-outputs.workspace = true
telescope-audio.workspace = true
telescope-effects.workspace = true
telescope-shell.workspace = true
telescope-system.workspace = true
telescope-plugin-host.workspace = true
serde_json.workspace = true
log.workspace = true
qrcode.workspace = true

[dev-dependencies]
flate2.workspace = true
# The settings window's tests drive it through Slint's testing backend (pinned like the shell's)
i-slint-backend-testing = "=1.18.1"
slint-interpreter.workspace = true
