[package]
name = "telescope-shell"
description = "The window: cards, the stream flow, settings, banners and onboarding"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
telescope-core.workspace = true
serde_json.workspace = true
log.workspace = true
# unstable-wgpu-30 and femtovg on wgpu: the preview hands Slint textures media painted on its device; unstable-winit-030 for the keys' scan codes
slint = { workspace = true, features = ["renderer-software", "software-renderer-systemfonts", "software-renderer-path", "unstable-wgpu-30", "renderer-femtovg-wgpu", "unstable-winit-030"] }
png = "0.18"
unicode-normalization = "0.1"
# Reads the settings window's accessible tree for the search (pinned: its API follows Slint's internals)
i-slint-backend-testing = "=1.18.1"
i-slint-core = "=1.18.1"
slint-interpreter.workspace = true
telescope-ui-kit.workspace = true


[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(windows)'.dependencies]
# Host::pick_file through the system's own file dialog, as Qt shows on Windows
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
