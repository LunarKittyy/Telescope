[package]
name = "telescope-media"
description = "Decoding the phone's video: H.264 through FFmpeg (VA-API, D3D11VA), MJPEG, frame timing"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# FFmpeg on Windows: a build with FFmpeg's libraries and headers at hand (FFMPEG_DIR); CI's Windows runner has none yet
ffmpeg-windows = ["dep:ffmpeg-sys-next"]

[dependencies]
telescope-core.workspace = true
log.workspace = true
serde_json.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-sys-next.workspace = true

[target.'cfg(windows)'.dependencies]
ffmpeg-sys-next = { workspace = true, optional = true }
