[package]
name = "telescope-media"
description = "Decoding the phone's video: H.264 through FFmpeg (VA-API, D3D11VA), MJPEG, frame timing"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# FFmpeg on Windows: a build with FFmpeg's libraries and headers at hand (FFMPEG_DIR) and its DLLs next to the program
ffmpeg-windows = ["dep:ffmpeg-sys-next"]

[dependencies]
telescope-core.workspace = true
log.workspace = true
serde_json.workspace = true
wgpu.workspace = true
pollster.workspace = true
libc.workspace = true
# MJPEG and pictures for a copy without FFmpeg, on what the image crate already brings in
zune-jpeg.workspace = true
zune-core.workspace = true
image = { workspace = true, features = ["png", "bmp", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-sys-next.workspace = true

[target.'cfg(windows)'.dependencies]
ffmpeg-sys-next = { workspace = true, optional = true }
libloading.workspace = true
# The decoder's graphics device gets a higher GPU priority (windows is already in the tree through Slint's winit backend)
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }
