<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1216">
<title>Telescope 3D</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0f1216; --text: #e7eaef; --dim: #8b96a4; --accent: #3d8bfd; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px; background: var(--bg); color: var(--text);
         font: 16px/1.3 -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, system-ui, sans-serif; }
  #flat { width: 100%; max-width: 1280px; aspect-ratio: 32 / 9; background: #000; border-radius: 8px; }
  #enter { font: inherit; font-size: 28px; font-weight: 700; padding: 20px 56px; border: 0; border-radius: 16px; background: var(--accent); color: #fff; cursor: pointer; }
  #enter:disabled { background: #2a3039; color: var(--dim); cursor: default; }
  #status { margin: 0; color: var(--dim); min-height: 1.3em; text-align: center; }
</style>
</head>
<body>
<canvas id="flat" width="1920" height="540"></canvas>
<button id="enter" type="button" disabled>Enter VR</button>
<p id="status" aria-live="polite">Connecting…</p>
<script src="/headset.js"></script>
</body>
</html>
