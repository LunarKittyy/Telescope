[package]
name = "telescope-outputs"
description = "Virtual cameras (v4l2loopback on Linux, the Windows 11 camera and UnityCapture), the Stream output card and webcams"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
telescope-core.workspace = true
log.workspace = true
serde_json.workspace = true
# The wait screen: pictures and GIFs people pick, and the default screen drawn the way vcam.py paints it
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
tiny-skia = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
slint-interpreter.workspace = true
telescope-ui-kit.workspace = true
