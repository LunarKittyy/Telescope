[package]
name = "telescope-outputs"
description = "Virtual cameras (v4l2loopback on Linux, the Windows 11 camera and UnityCapture), the Stream output card and webcams"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
telescope-core.workspace = true
log.workspace = true
serde_json.workspace = true
# The wait screen: pictures and GIFs people pick, in the formats its file dialog lists (Python's list of Qt's, less the ones with no decoder here), and the default screen drawn the way vcam.py paints it
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp", "ico", "pnm", "tga", "webp"] }
tiny-skia = "0.12"

ring.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
# libgphoto2 for DSLRs, loaded at run time so a system without it still starts
libloading.workspace = true

# Webcams through Media Foundation (windows is already in the tree through Slint's winit backend), Spout senders through Direct3D 11 and
# shared memory; downloading and checking UnityCapture for the camera install
[target.'cfg(windows)'.dependencies]
ureq.workspace = true
windows = { version = "0.62", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_PortableDevices", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_DirectShow", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
slint-interpreter.workspace = true
telescope-ui-kit.workspace = true
slint.workspace = true

[lints]
workspace = true
