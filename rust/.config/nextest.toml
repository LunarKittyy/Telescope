# Each test runs in its own process, so a Mutex in a test file no longer keeps two of them apart. What's shared across processes goes here.
[profile.default]
# A flaky test should fail, not hide
retries = 0
status-level = "fail"
final-status-level = "slow"
failure-output = "immediate"
success-output = "never"
fail-fast = false

[test-groups]
# The virtual mic's source name is claimed machine-wide, so a copy that finds it taken leaves it alone
real-starts = { max-threads = 1 }
# The pairing server takes a fixed port first
pairing-port = { max-threads = 1 }
# Spout's sender list and active sender name are one for the whole machine, so the Windows tests that make senders take turns
spout-list = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(commands)"
test-group = "real-starts"

[[profile.default.overrides]]
filter = "binary(integration)"
test-group = "pairing-port"

[[profile.default.overrides]]
filter = "package(telescope-outputs) & test(/^spout/)"
test-group = "spout-list"

# A test that waits on a message bus or a dialog has no business taking long: one that does is killed and fails instead of holding the run
[[profile.default.overrides]]
filter = "test(file_dialog)"
slow-timeout = { period = "15s", terminate-after = 2 }

# The compositor draws on several threads and is timed against a single-threaded yardstick, so other tests sharing the cores skew the ratio: it gets the whole machine
[[profile.default.overrides]]
filter = "test(four_1080p_streams_draw_quickly)"
threads-required = "num-cpus"

# The slowest tests (a minute or more each on a CI runner) start first, so a run doesn't end on one of them alone
[[profile.default.overrides]]
filter = "binary(appearance_render) | binary(plugin_removal) | binary(view_hand_over) | binary(specimen)"
priority = 50

# What CI runs: the same, plus how long each test took
[profile.ci.junit]
path = "junit.xml"
