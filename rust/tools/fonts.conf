<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- For a system with no fontconfig of its own, which also means no /etc/fonts/fonts.conf: the usual font folders and a cache in the user's. -->
<fontconfig>
    <dir>/usr/share/fonts</dir>
    <dir>/usr/local/share/fonts</dir>
    <dir prefix="xdg">fonts</dir>
    <dir>~/.fonts</dir>
    <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
