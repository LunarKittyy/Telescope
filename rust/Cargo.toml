[workspace]
resolver = "2"
members = [
    "app",
    "crates/core",
    "crates/ui-kit",
    "crates/link",
    "crates/media",
    "crates/outputs",
    "crates/audio",
    "crates/shell",
    "crates/system",
    "crates/plugin-host",
    "crates/effects",
    "crates/setup",
    "crates/vision",
]

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

# One place for versions, so two crates never pull in two copies of the same thing
[workspace.dependencies]
telescope-core = { path = "crates/core" }
telescope-ui-kit = { path = "crates/ui-kit" }
telescope-link = { path = "crates/link" }
telescope-media = { path = "crates/media" }
telescope-outputs = { path = "crates/outputs" }
telescope-audio = { path = "crates/audio" }
telescope-shell = { path = "crates/shell" }
telescope-system = { path = "crates/system" }
telescope-plugin-host = { path = "crates/plugin-host" }
telescope-effects = { path = "crates/effects" }
telescope-setup = { path = "crates/setup" }
telescope-vision = { path = "crates/vision" }

# preserve_order: settings keep the key order Python saved them in
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
# The UDP video socket's receive buffer, on Windows too (already in Cargo.lock for other crates)
socket2 = "0.6"
polling = "3.11"
base64 = "0.23"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
# The Browser camera's WebRTC, sans-IO on our own UDP sockets, with pure-Rust DTLS and SRTP
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
mdns-sd = { version = "0.21", default-features = false }
if-addrs = "0.15"
ffmpeg-sys-next = { version = "8", default-features = false, features = ["avcodec", "swscale"] }
# GPU frame steps: 30 is the version Slint 1.18's unstable-wgpu-30 takes, so the preview can share textures later
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles", "dx12"] }
pollster = "1"
qrcode = { version = "0.14", default-features = false }
# Reading QR codes off the picture (QR codes), without the image crate it can use for files
rqrr = { version = "0.11", default-features = false }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
# Plugins people add: Lua 5.4 built from source, .zip packages, update checks over HTTPS, WGSL checks without a GPU
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "serialize"] }
# lzma: the vision and matting packs are LZMA zips (tools/build_vision_pack.py), and older packs are deflate, so both are read
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "lzma"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Unpacking the Linux update's .tar.gz, on the same zlib as zip
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# The global shortcuts portal on Linux, already in the tree through Slint's accessibility
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Reading Google's SDK index for the adb download on Windows
roxmltree = "0.21"
# The microphone: loading RNNoise as Python did, and the Windows sound output VB-Cable is played into
libloading = "0.9"
# Robust Video Matting for the Background card's high quality cutout, run by ONNX Runtime's own library from an optional download (nothing is linked or bundled)
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
zune-jpeg = "0.5"
zune-core = "0.5"
image = { version = "0.25", default-features = false }
# Cleared pixel buffers for the offscreen window drawing in tests, as zeroed memory (already in the tree through Slint)
bytemuck = { version = "1.25", features = ["extern_crate_alloc"] }
# The program's own icon and name on Windows, for Explorer, the tray and the firewall's question
winresource = "0.1"
cpal = "0.18"
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
slint-interpreter = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }

# femtovg 0.27 (the version Slint 1.18 takes) drops every pipeline a flush didn't use and compiles it again on the next one, which was most of a frame's cost: see vendor/femtovg/PATCH.txt
[patch.crates-io]
femtovg = { path = "vendor/femtovg" }
# The Slint interpreter (1.18.1) clones every item's geometry expression and builds a hash map from it on every walk of the item tree: see vendor/slint-interpreter/PATCH.txt
slint-interpreter = { path = "vendor/slint-interpreter" }
# The tracker behind the interpreter's geometry cache has to keep an invalidation raised while it evaluates: see vendor/i-slint-core/PATCH.txt
i-slint-core = { path = "vendor/i-slint-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# No panic = "abort": the host catches a panicking plugin and carries on, as the Python app catches its exceptions

# Crates that run once at a start or a click, never per frame: smaller code instead of faster
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.zbus]
opt-level = "s"
[profile.release.package.zvariant]
opt-level = "s"
[profile.release.package.zbus_names]
opt-level = "s"
[profile.release.package.ureq]
opt-level = "s"
[profile.release.package.mdns-sd]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.pulldown-cmark]
opt-level = "s"
[profile.release.package.accesskit_unix]
opt-level = "s"
[profile.release.package.zip]
opt-level = "s"
[profile.release.package.tar]
opt-level = "s"
[profile.release.package.roxmltree]
opt-level = "s"
[profile.release.package.winit]
opt-level = "s"
[profile.release.package.wayland-client]
opt-level = "s"
[profile.release.package.wayland-protocols]
opt-level = "s"
[profile.release.package.wayland-protocols-plasma]
opt-level = "s"
[profile.release.package.wayland-protocols-wlr]
opt-level = "s"
[profile.release.package.sctk-adwaita]
opt-level = "s"
[profile.release.package.smithay-client-toolkit]
opt-level = "s"

# Every test window goes through Slint's compiler, and unoptimised it spends over a second on each one
[profile.dev.package.i-slint-compiler]
opt-level = 2
[profile.dev.package.rowan]
opt-level = 2
[profile.dev.package.i-slint-common]
opt-level = 2
[profile.dev.package.slint-interpreter]
opt-level = 2
[profile.dev.package.i-slint-core]
opt-level = 2

# The pattern matcher plugins use counts its steps, and unoptimised the tests that wear it out take seconds
[profile.dev.package.telescope-plugin-host]
opt-level = 2

# The bubbles' pictures and the framing maths run on the UI thread in a dev build, and unoptimised they are tens of milliseconds
[profile.dev.package.telescope-effects]
opt-level = 2

# The BT.709 conversion runs on every frame of an HD stream, and unoptimised (with overflow checks) it takes tens of milliseconds
[profile.dev.package.telescope-media]
opt-level = 2
overflow-checks = false
