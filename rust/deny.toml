[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
ignore = [
    # Timing leaks in str0m's DTLS ECDSA; the fix needs RustCrypto 0.14, which str0m and dimpl haven't moved to. Re-check on each str0m bump.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via str0m, no fixed release reachable yet" },
    # The unmaintained ones all arrive through Slint/winit and go away with a Slint bump
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via winit's title bar, no upstream fix" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via accesskit_unix, waits for accesskit to use zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via accesskit_unix, waits for accesskit to use zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via accesskit_unix, waits for accesskit to use zbus 6" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils via slint-macros, build time only" },
]

[licenses]
version = 2
# The binaries are AGPL-3.0 (see LICENSE), so GPL-compatible licences are fine
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0", "GPL-3.0-only", "GPL-3.0-or-later", "AGPL-3.0-only", "AGPL-3.0-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later", "OpenSSL", "CDLA-Permissive-2.0", "WTFPL"]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
