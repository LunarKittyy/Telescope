<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup loop</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root { --night: #0f1216; --lav: #aa9cf5; --lav-light: #cdc4fa; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--night); }
body { width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; left: 0; top: 0; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--night); }
#stars { position: absolute; inset: 0; }
#world { position: absolute; left: 0; top: 0; width: 1300px; height: 760px; transform-origin: 0 0; }

/* the desktop app window: real renders at 2x, shown at 1300x760 */
.appwin { position: absolute; left: 0; top: 0; width: 1300px; height: 760px; border-radius: 12px; overflow: hidden;
  box-shadow: 0 0 0 1px #2a303a, 0 40px 90px rgba(0,0,0,0.55), 0 12px 30px rgba(0,0,0,0.35); background: #0f1216; }
.appwin img, .shot { position: absolute; left: 0; top: 0; width: 1300px; height: 760px; display: block; }
#feedbox { position: absolute; left: 430px; top: 246px; width: 428px; height: 241px; overflow: hidden; background: #000; }
#feedbox .feed, #tilefeed .feed { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#appdim { position: absolute; inset: 0; background: #07090c; opacity: 0; }
.ring { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; border: 2px solid var(--lav-light); opacity: 0; }

/* the Add phone dialog; the window frame stays plain so the real render carries it */
#dlg { position: absolute; left: 420px; top: 195px; width: 460px; height: 369px; border-radius: 10px; overflow: hidden; background: #242424;
  box-shadow: 0 0 0 1px #2c323c, 0 30px 70px rgba(0,0,0,0.6), 0 8px 20px rgba(0,0,0,0.35); transform-origin: 50% 40%; }
#dlg img { position: absolute; left: 0; top: 0; width: 460px; display: block; }

/* a generic video call app, deliberately not Telescope's look */
#call { position: absolute; left: 880px; top: 240px; width: 720px; height: 350px; border-radius: 12px; overflow: hidden; background: #202124;
  box-shadow: 0 0 0 1px #34363b, 0 40px 90px rgba(0,0,0,0.6), 0 12px 28px rgba(0,0,0,0.4); color: #e8eaed; font-family: "Instrument Sans", sans-serif; }
#call .bar { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; padding: 0 16px; font-size: 14px; font-weight: 600; color: #bdc1c6; background: #1a1b1e; border-bottom: 1px solid #2c2e33; }
#call .bar .x { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; background: #2c2e33; display: flex; align-items: center; justify-content: center; }
#call .bar .x svg { width: 10px; height: 10px; }
.tile { position: absolute; top: 58px; width: 334px; height: 188px; border-radius: 10px; overflow: hidden; background: #2b2d31; }
.tile .who { position: absolute; left: 10px; bottom: 9px; font-size: 13px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
.avatar { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -46px 0 0 -38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: "Bricolage Grotesque", sans-serif; font-weight: 650; font-size: 32px; color: #fff; }
#tilefeed { position: absolute; inset: 0; opacity: 0; }
#call .ctrls { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; display: flex; align-items: center; justify-content: center; gap: 14px; }
.cbtn { height: 48px; min-width: 48px; border-radius: 24px; background: #3c4043; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; }
.cbtn svg { width: 20px; height: 20px; stroke: #e8eaed; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cbtn.leave { background: #d93f37; min-width: 64px; }
.cbtn .chev { width: 14px; height: 14px; }
#menu { position: absolute; left: 270px; bottom: 92px; width: 248px; padding: 6px; border-radius: 10px; background: #2d2f33; box-shadow: 0 0 0 1px #3c3f44, 0 18px 40px rgba(0,0,0,0.55); transform-origin: 30% 100%; opacity: 0; }
#menu .h { font-size: 12px; font-weight: 600; color: #9aa0a6; padding: 8px 10px 6px; }
#menu .it { position: relative; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 6px; font-size: 14px; }
#menu .it .ck { width: 16px; height: 16px; }
#menu .it .ck svg { width: 16px; height: 16px; stroke: #8ab4f8; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#menu .hl { position: absolute; left: 6px; right: 6px; height: 38px; border-radius: 6px; background: #3c4043; opacity: 0; }

/* pointer, Adwaita-like */
#cursor { position: absolute; left: 0; top: 0; width: 22px; height: 32px; transform-origin: 2px 2px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45)); opacity: 0; }
.click { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(205,196,250,0.35); opacity: 0; }

/* the phone, a Pixel 9 Pro from the front, in screen space in front of the monitor */
#phone { position: absolute; left: 0; top: 0; width: 407px; height: 858px; transform-origin: 50% 50%; }
#phone .body { position: absolute; inset: 0; border-radius: 62px; background: linear-gradient(105deg, #b9b5ae 0%, #dcd8d1 20%, #aaa69f 50%, #d2cec7 78%, #a19d96 100%); }
#phone .glass { position: absolute; inset: 6px; border-radius: 57px; background: #050607; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
#phone .btn { position: absolute; right: -3px; width: 5px; border-radius: 0 3px 3px 0; background: linear-gradient(90deg, #b9b4ab, #e4e0d9 55%, #a9a49b); }
#phone .scr { position: absolute; left: 19px; top: 19px; width: 369px; height: 820px; border-radius: 44px; overflow: hidden; background: #111417; }
#phone .px { position: absolute; left: 0; top: 0; width: 1080px; height: 2400px; transform: scale(0.341667); transform-origin: 0 0; }
#phone .px > .pane { position: absolute; inset: 0; }
#phone .px .pane > img { position: absolute; left: 0; top: 0; width: 1080px; height: 2400px; display: block; }
#phone .hole { position: absolute; left: 50%; top: 13px; width: 19px; height: 19px; margin-left: -9.5px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #1d2330 0 2px, #020203 3.2px); box-shadow: 0 0 0 1.5px #000; }
#phone .sheen { position: absolute; inset: 19px; border-radius: 44px; background: linear-gradient(118deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 34%); pointer-events: none; }
#shadow { position: absolute; left: 0; top: 0; width: 407px; height: 858px; border-radius: 62px; background: rgba(0,0,0,0.55); filter: blur(34px); transform-origin: 50% 50%; }
#touch { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,0.28); opacity: 0; }

/* the scanner, rebuilt on the real ScanActivity's geometry, over a camera view of the monitor */
#scan { position: absolute; inset: 0; opacity: 0; background: #000; }
#vf { position: absolute; left: 0; top: 136px; width: 1080px; height: 2200px; overflow: hidden; background: #0b0d10; }
#vfworld { position: absolute; left: 0; top: 0; width: 1300px; height: 760px; transform-origin: 0 0; }
#vfworld .cam { position: absolute; inset: 0; filter: blur(1.2px) brightness(1.18) contrast(0.88) saturate(0.9); }
#scrim { position: absolute; left: 0; top: 136px; width: 1080px; height: 2200px; }
#hint { position: absolute; left: 0; right: 0; top: 2160px; text-align: center; color: #fff; font-family: "Inter", sans-serif; font-size: 39px; font-weight: 500; }
#scanclock { position: absolute; left: 0; top: 0; width: 300px; height: 136px; overflow: hidden; }
#scanclock img { position: absolute; left: 0; top: 0; width: 300px; height: 136px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="stars" width="1920" height="1080"></canvas>

  <div id="world">
    <div class="appwin" id="appwin">
      <img class="shot" id="s1" src="img/s1-checking.png">
      <img class="shot" id="s2" src="img/s2-vcam.png">
      <img class="shot" id="s3" src="img/s3-paired.png">
      <img class="shot" id="s4" src="img/s4-live.png">
      <div id="feedbox"></div>
      <div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="ring" id="r3"></div>
      <div id="appdim"></div>
    </div>
    <div id="dlg"><img id="dadd" src="img/d-add.png"><img id="dpaired" src="img/d-paired.png"></div>

    <div id="call">
      <div class="bar">Weekly sync<div class="x"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="#bdc1c6" stroke-width="1.6" stroke-linecap="round"/></svg></div></div>
      <div class="tile" style="left:18px"><div class="avatar" style="background:#7a5c46">S</div><div class="who">Sam</div></div>
      <div class="tile" style="left:368px" id="youtile"><div class="avatar" style="background:#4b6a8a">L</div><div id="tilefeed"></div><div class="who">You</div></div>
      <div class="ctrls">
        <div class="cbtn"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
        <div class="cbtn" id="cambtn"><svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="12.5" height="11" rx="2.2"/><path d="M15.5 10.5l5-3v9l-5-3"/></svg><svg class="chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></div>
        <div class="cbtn"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M12 20v-3.5M8 20h8M12 13V8M9.5 10.5L12 8l2.5 2.5"/></svg></div>
        <div class="cbtn leave"><svg viewBox="0 0 24 24"><path d="M3.5 13.5c4.7-4 12.3-4 17 0l-1.8 2.6-3.2-1.4v-2.5a11 11 0 0 0-7 0v2.5l-3.2 1.4z" fill="#fff" stroke="none"/></svg></div>
      </div>
      <div id="menu">
        <div class="h">Camera</div>
        <div class="hl" id="menuhl"></div>
        <div class="it" id="mi1"><span class="ck" id="ck1"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>Integrated Webcam</div>
        <div class="it" id="mi2"><span class="ck" id="ck2"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>Telescope</div>
      </div>
    </div>

    <div class="click" id="click"></div>
    <svg id="cursor" viewBox="0 0 22 32"><path d="M2 2 L2 25.5 L7.6 20.4 L11.4 29.2 L15.3 27.5 L11.6 18.9 L19.2 18.9 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>

  <div id="shadow"></div>
  <div id="phone">
    <div class="body"></div>
    <div class="btn" style="top:226px;height:58px"></div>
    <div class="btn" style="top:318px;height:118px"></div>
    <div class="glass"></div>
    <div class="scr">
      <div class="px">
        <div class="pane" id="phome"><img src="img/p-home.png"></div>
        <div class="pane" id="ppaired" style="opacity:0"><img src="img/p-paired.png"></div>
        <div class="pane" id="scan">
          <div id="vf"><div id="vfworld"><div class="cam" id="vfcam"></div></div></div>
          <svg id="scrim" viewBox="0 0 1080 2200"><path fill="rgba(0,0,0,0.37)" fill-rule="evenodd" d="M0 0H1080V2200H0Z M108 668V1534H972V668Z"/></svg>
          <div id="hint">Point the camera at the pairing code on your computer</div>
          <div id="scanclock"><img src="img/p-scan-clock.png"></div>
        </div>
        <div id="touch"></div>
      </div>
      <div class="hole"></div>
    </div>
    <div class="sheen"></div>
  </div>
</div>
<script src="../common/feed.js"></script>
<script src="setup.js"></script>
</body>
</html>
