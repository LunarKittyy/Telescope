name: Bug
description: Something doesn't work, or works wrong
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead. Screenshots and screen recordings help a lot, drag them in here.
    validations:
      required: true

  - type: textarea
    id: desktop-diagnostics
    attributes:
      label: Desktop diagnostics
      description: |
        In the desktop app, open the gear menu, then Advanced, and click **Copy diagnostics** at the bottom, then paste here. It has the version, your system, the connection and recent errors, with addresses and tokens stripped out.
        On an older version without that button, write the version shown at the bottom of Advanced instead.
      render: text
    validations:
      required: true

  - type: dropdown
    id: desktop-os
    attributes:
      label: Computer
      options:
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true

  - type: textarea
    id: phone-diagnostics
    attributes:
      label: Phone diagnostics
      description: |
        In the Telescope app on the phone, open About and tap **Copy diagnostics**, then paste here. It has the app version, phone model, Android version and recent errors, and never includes your pairing token or addresses.
        Can't get to it? Just write your phone model and Android version.
      render: text
    validations:
      required: true
