name: Docs

# Checks that docs only mention files that exist, and lists the docs whose code changed since they were checked.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      # The full history is needed to look up each doc's `checked` commit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Flags never fail the job: they are for a person to look at, in the job summary
      - name: Docs to look at
        run: |
          {
            echo "## Docs to look at"
            echo
            python3 tools/docs_fresh.py --summary
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Every doc has its line and every path it mentions exists
        run: python3 tools/docs_fresh.py --paths
