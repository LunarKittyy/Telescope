name: Build APK

# Checks pull requests; release.yml calls it with a build number and channel to make the signed APK.
on:
  pull_request:
    paths: [android/**, VERSION]
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        type: string
        required: true
      channel:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Lint and unit test
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon

      # Release runs only: every published APK carries the same signature, so each one installs as
      # an update over the last. A missing secret fails the release instead of shipping a debug key.
      - name: Decode the signing key
        if: inputs.channel
        env:
          KEYSTORE_B64: ${{ secrets.TELESCOPE_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The TELESCOPE_KEYSTORE secret isn't set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/telescope-release.jks"
          echo "TELESCOPE_KEYSTORE_FILE=$RUNNER_TEMP/telescope-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          TELESCOPE_KEYSTORE_PASSWORD: ${{ secrets.TELESCOPE_KEYSTORE_PASSWORD }}
          TELESCOPE_KEY_ALIAS: ${{ secrets.TELESCOPE_KEY_ALIAS }}
          TELESCOPE_KEY_PASSWORD: ${{ secrets.TELESCOPE_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PbuildNumber=${{ inputs.build || '1' }}
          -Pchannel=${{ inputs.channel || 'dev' }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Telescope.apk

      - name: Check the signature
        if: inputs.channel
        run: |
          certs=$("$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs Telescope.apk)
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Telescope.apk
          retention-days: 7
