name: Release

# One pipeline for both channels, so every release holds an APK, two desktop bundles and a
# manifest.json from the same commit:
#   push to master  -> the rolling "nightly" pre-release
#   push a v* tag   -> a stable release (the tag must match the VERSION file)
on:
  push:
    branches: [master]
    tags: ['v*']
    # A merge that only changes docs or the website doesn't rebuild the nightly. Tag pushes ignore this filter.
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!site/**'
      - '!.github/workflows/pages.yml'
      - .github/NIGHTLY_NOTES.md
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      channel: ${{ steps.meta.outputs.channel }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number is the commit count

      - id: meta
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          build=$(git rev-list --count HEAD)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=stable
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag doesn't match VERSION ($version)"
              exit 1
            fi
          else
            channel=nightly
            tag=nightly
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "channel=$channel"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Telescope $version, $channel build $build"

  apk:
    needs: meta
    uses: ./.github/workflows/build-apk.yml
    with:
      build: ${{ needs.meta.outputs.build }}
      channel: ${{ needs.meta.outputs.channel }}
    secrets: inherit

  windows:
    needs: meta
    uses: ./.github/workflows/build-windows.yml
    with:
      build: ${{ needs.meta.outputs.build }}
      channel: ${{ needs.meta.outputs.channel }}

  linux:
    needs: meta
    uses: ./.github/workflows/build-linux.yml
    with:
      build: ${{ needs.meta.outputs.build }}
      channel: ${{ needs.meta.outputs.channel }}

  # The setup holds the same files as Telescope-windows.zip, APK included, so it's built once both are ready.
  windows-setup:
    needs: [meta, apk, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Build TelescopeSetup.exe
        shell: pwsh
        run: |
          Copy-Item dist/apk/Telescope.apk dist/windows-bundle/
          ./installer/build.ps1 -Bundle dist/windows-bundle -Out setup -Build "${{ needs.meta.outputs.build }}"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: setup/TelescopeSetup.exe
          retention-days: 7

  publish:
    needs: [meta, apk, windows, linux, windows-setup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      TAG: ${{ needs.meta.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      # The APK rides along in both desktop bundles, so "Install over USB" works without a download.
      - name: Pack the bundles
        run: |
          mkdir out
          cp dist/apk/Telescope.apk out/
          cp dist/windows-setup/TelescopeSetup.exe out/  # in manifest.json too: an unzipped copy updates through it
          cp dist/apk/Telescope.apk dist/windows-bundle/
          (cd dist/windows-bundle && zip -qr ../../out/Telescope-windows.zip .)
          cp dist/apk/Telescope.apk dist/linux-bundle/
          chmod +x dist/linux-bundle/start.sh  # artifacts don't keep file modes
          tar -czf out/Telescope-linux.tar.gz -C dist/linux-bundle .

      - name: Write manifest.json
        run: >-
          python3 .github/write_manifest.py
          --version "$VERSION" --build "$BUILD" --channel "$CHANNEL" --commit "$GITHUB_SHA"
          --tag "$TAG" --repo "$GITHUB_REPOSITORY" --out out/manifest.json
          out/Telescope.apk out/Telescope-windows.zip out/TelescopeSetup.exe out/Telescope-linux.tar.gz

      - name: Publish the stable release
        if: needs.meta.outputs.channel == 'stable'
        run: |
          notes=".github/release-notes/$VERSION.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$TAG" out/* --verify-tag --latest \
            --title "Telescope $VERSION" "${notes_args[@]}"

      # Delete and recreate nightly so its tag moves to the commit this build came from.
      - name: Publish nightly
        if: needs.meta.outputs.channel == 'nightly'
        run: |
          {
            echo "Telescope $VERSION nightly $BUILD, built from \`${GITHUB_SHA::7}\`."
            echo
            cat .github/NIGHTLY_NOTES.md
          } > notes.md
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly out/* --prerelease --latest=false \
            --title "Nightly" --notes-file notes.md --target "$GITHUB_SHA"
