name: Rust desktop (ARM64)

# A probe for ARM64 Linux and Windows. It runs after merges, not on PRs, so its known failures don't show red on every PR.
on:
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  linux-arm64:
    name: linux (arm64)
    runs-on: ubuntu-24.04-arm
    # The x86_64 job runs on ubuntu-latest, which has FFmpeg 8. 24.04 has 6.1, which the code doesn't build against
    container: ubuntu:26.04
    continue-on-error: true
    timeout-minutes: 60
    concurrency:
      group: rust-arm64-linux-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Install system libraries and Rust
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential python3 nodejs clang pkg-config libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libfontconfig1-dev libxkbcommon-dev \
            fonts-inter fonts-noto-core fonts-noto-cjk libegl1 libgl1 libdbus-1-3
          curl -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      # The checkout belongs to another user inside the container, which git refuses to read
      - run: git config --global --add safe.directory '*'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      - name: Build
        run: cargo build --workspace --locked --all-targets

      - name: Test
        run: cargo nextest run --workspace --locked --no-fail-fast

  windows-arm64:
    name: windows (arm64)
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 90
    concurrency:
      group: rust-arm64-windows-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Keep line endings as they are
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # GyanD's builds are x64 only, so this is BtbN's ARM64 GPL build. Only for the tests
      - name: Install FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-winarm64-gpl-shared-8.1.zip -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP"
          $env:FFMPEG_DIR = "$env:RUNNER_TEMP\ffmpeg-n8.1-latest-winarm64-gpl-shared-8.1"
          Get-ChildItem "$env:FFMPEG_DIR\lib" | Select-Object -First 30 | Out-Host
          "FFMPEG_DIR=$env:FFMPEG_DIR" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "$env:FFMPEG_DIR\bin" >> $env:GITHUB_PATH

      - name: Rust and LLVM
        shell: pwsh
        run: |
          rustc -vV
          Get-Command clang, libclang.dll -ErrorAction SilentlyContinue | Out-Host
          Get-ChildItem "C:\Program Files\LLVM\bin" -Filter "libclang*" -ErrorAction SilentlyContinue | Out-Host

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      - name: Build
        run: cargo build --workspace --locked --all-targets --features telescope-app/ffmpeg-windows

      - name: Test
        run: cargo nextest run --workspace --locked --no-fail-fast --features telescope-app/ffmpeg-windows
