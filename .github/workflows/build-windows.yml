name: Build Windows EXE

# Checks pull requests; release.yml calls it with a build number and channel to make the release bundle.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read

jobs:
  # "windows" runs on every pull request so it can be a required check, and skips itself when nothing it covers changed
  changes:
    name: changes (windows)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run || 'true' }}
    steps:
      # A pull request checks out its merge into master, whose first parent is master: the diff is what it changes
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(desktop/|installer/|VERSION$|\.github/workflows/build-windows\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: windows
    needs: changes
    # Runs unless changes said there's nothing to check, so a changes job that failed doesn't pass this silently
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: windows-latest
    # A new push to a pull request cancels the check still running for the old one.
    concurrency:
      group: windows-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # Bundled into the app, so the newest one every pinned package has wheels for
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies and PyInstaller
        working-directory: desktop
        run: pip install -r requirements-dev.txt pyinstaller -c constraints.txt

      - name: Install aiortc and pyrnnoise
        working-directory: desktop
        run: pip install --no-deps -r requirements-nodeps.txt -c constraints.txt

      - name: Run tests
        working-directory: desktop
        run: python -m pytest -q -n auto

      - name: Stamp the version
        if: inputs.channel
        working-directory: desktop
        run: python scripts/write_build_info.py --build "${{ inputs.build }}" --channel "${{ inputs.channel }}" --commit "${{ github.sha }}"

      - name: Packaging smoke checks
        working-directory: desktop
        run: python scripts/smoke_check.py

      # Runners are admin with UAC off, so this runs the first-run checklist's Install driver for real: an old
      # app-folder registration, hostile leftovers in Program Files (rejected, their targets untouched), then a clean
      # install that migrates the old one, ignores a redirected %ProgramFiles%, and opens as "Telescope".
      - name: Check the virtual camera driver install
        working-directory: desktop
        shell: pwsh
        run: ./scripts/windows_driver_check.ps1

      - name: Build the app folder
        working-directory: desktop
        run: pyinstaller telescope.spec

      # release.yml adds Telescope.apk and packs this into Telescope-windows-portable.zip.
      - name: Assemble release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bundle
          Copy-Item -Recurse desktop/dist/TelescopeDesktop/* bundle/
          Copy-Item desktop/THIRD_PARTY_NOTICES.txt bundle/
          Copy-Item -Recurse desktop/unitycapture bundle/unitycapture

      - name: Verify release bundle
        shell: pwsh
        run: |
          $required = @(
            "bundle/TelescopeDesktop.exe",
            "bundle/THIRD_PARTY_NOTICES.txt",
            "bundle/unitycapture"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          # The app's libraries, and the Qt plugins it can't start or draw without (tests run from source,
          # so only this notices one PyInstaller left out): the window, SVG icons, GIF wait screens.
          $lib = Get-ChildItem bundle -Directory -Filter "lib-*" | Select-Object -First 1
          if (-not $lib) { $missing += "bundle/lib-<build>" }
          else {
            foreach ($plugin in "platforms/qwindows.dll", "iconengines/qsvgicon.dll",
                                "imageformats/qsvg.dll", "imageformats/qgif.dll") {
              if (-not (Test-Path "$($lib.FullName)/PyQt6/Qt6/plugins/$plugin")) { $missing += $plugin }
            }
            # Without it Auto framing and Background have no pack to download
            if (-not (Test-Path "$($lib.FullName)/telescope/vision_pack.json")) { $missing += "telescope/vision_pack.json" }
            # The microphone's noise reduction, loaded by path rather than imported
            if (-not (Test-Path "$($lib.FullName)/pyrnnoise/rnnoise.dll")) { $missing += "pyrnnoise/rnnoise.dll" }
          }
          # adb is under Google's SDK license, which doesn't allow passing it on: the app downloads it on request
          if (Get-ChildItem bundle -Recurse -Filter "adb*.exe") { Write-Error "adb must not be in the bundle"; exit 1 }
          if ($missing) {
            Write-Error "Release bundle is missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Release bundle verified."

      # A per-user install, a look at what it made, then an uninstall that has to leave nothing behind.
      # A release skips these two: release.yml builds the published setup with Telescope.apk inside and runs both on it.
      - name: Build and check the installer
        if: ${{ !inputs.channel }}
        shell: pwsh
        run: |
          ./installer/build.ps1 -Bundle bundle -Out setup -Build "0" -Fast
          ./installer/check.ps1 -Setup setup/TelescopeSetup.exe

      # The update path for people who unzipped Telescope: the real setup, registry entry and clean-up.
      - name: Check an unzipped copy moves to the installed one
        if: ${{ !inputs.channel }}
        working-directory: desktop
        run: python scripts/windows_move_check.py ../setup/TelescopeSetup.exe ../bundle

      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: bundle/
          retention-days: 7
