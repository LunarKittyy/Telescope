name: Build Windows EXE

# Checks pull requests; release.yml calls it with a build number and channel to make the release bundle.
on:
  pull_request:
    paths: [desktop/**, VERSION]
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        type: string
        required: true
      channel:
        type: string
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        working-directory: desktop
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        working-directory: desktop
        run: python -m pytest -q

      - name: Install runtime deps + PyInstaller
        working-directory: desktop
        run: pip install -r requirements.txt pyinstaller -c constraints.txt

      - name: Stamp the version
        if: inputs.channel
        working-directory: desktop
        run: python scripts/write_build_info.py --build "${{ inputs.build }}" --channel "${{ inputs.channel }}" --commit "${{ github.sha }}"

      - name: Packaging smoke checks
        working-directory: desktop
        run: python scripts/smoke_check.py

      # Runners are admin, so this does what the first-run checklist's Install driver does, then checks
      # apps would list the camera as "Telescope" and pyvirtualcam opens it by that name.
      - name: Register the virtual camera as Telescope
        working-directory: desktop
        run: |
          python -c "from telescope.platform.windows import register_unitycapture as r; ok, msg = r(); print(ok, msg); assert ok, msg"
          python -c "from telescope.platform.windows import uc_registered_name as n; name = n(); print(name); assert name == 'Telescope', name"
          python -c "import pyvirtualcam; cam = pyvirtualcam.Camera(width=640, height=480, fps=30, backend='unitycapture', device='Telescope'); print(cam.device); cam.close()"

      - name: Build EXE
        working-directory: desktop
        run: pyinstaller telescope.spec

      # release.yml adds Telescope.apk and packs this into Telescope-windows.zip.
      - name: Assemble release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bundle
          Copy-Item desktop/dist/TelescopeDesktop.exe bundle/
          Copy-Item desktop/THIRD_PARTY_NOTICES.txt bundle/
          Copy-Item -Recurse desktop/platform-tools bundle/platform-tools
          Copy-Item -Recurse desktop/unitycapture bundle/unitycapture

      - name: Verify release bundle
        shell: pwsh
        run: |
          $required = @(
            "bundle/TelescopeDesktop.exe",
            "bundle/THIRD_PARTY_NOTICES.txt",
            "bundle/platform-tools",
            "bundle/unitycapture"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Release bundle is missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Release bundle verified."

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: bundle/
          retention-days: 7
