name: Build Windows EXE

# Checks pull requests; release.yml calls it with a build number and channel to make the release bundle.
on:
  pull_request:
    paths: [desktop/**, VERSION, .github/workflows/build-windows.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # A new push to a pull request cancels the check still running for the old one.
    concurrency:
      group: windows-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and PyInstaller
        working-directory: desktop
        run: pip install -r requirements-dev.txt pyinstaller -c constraints.txt

      - name: Run tests
        working-directory: desktop
        run: python -m pytest -q

      - name: Stamp the version
        if: inputs.channel
        working-directory: desktop
        run: python scripts/write_build_info.py --build "${{ inputs.build }}" --channel "${{ inputs.channel }}" --commit "${{ github.sha }}"

      - name: Packaging smoke checks
        working-directory: desktop
        run: python scripts/smoke_check.py

      # A leftover install tree owned by and writable for ordinary users, with a stale DLL in it: registering must
      # take it back (owner Administrators, users read only) rather than load from a folder a user can change.
      - name: Leave a user-owned driver folder behind
        shell: pwsh
        run: |
          $telescope = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Telescope'
          $dst = Join-Path $telescope 'UnityCapture'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Set-Content -LiteralPath (Join-Path $dst 'UnityCaptureFilter64.dll') -Value 'stale'
          icacls $telescope /grant '*S-1-5-32-545:(OI)(CI)F' /T /Q
          icacls $telescope /setowner '*S-1-5-32-545' /T /Q
          if ($LASTEXITCODE -ne 0) { throw 'could not set up the user-owned folder' }

      # Runners are admin, so this does what the first-run checklist's Install driver does, then checks
      # apps would list the camera as "Telescope" and pyvirtualcam opens it by that name.
      - name: Register the virtual camera as Telescope
        working-directory: desktop
        run: |
          python -c "from telescope.platform.windows import register_unitycapture as r; ok, msg = r(); print(ok, msg); assert ok, msg"
          python -c "from telescope.platform.windows import uc_registered_name as n; name = n(); print(name); assert name == 'Telescope', name"
          python -c "from telescope.platform.windows import uc_in_app_folder as f, protected_unitycapture_dir as d; print(d()); assert not f(), 'registered from the app folder'; assert all((d() / n).exists() for n in ('UnityCaptureFilter32.dll', 'UnityCaptureFilter64.dll'))"
          python -c "import pyvirtualcam; cam = pyvirtualcam.Camera(width=640, height=480, fps=30, backend='unitycapture', device='Telescope'); print(cam.device); cam.close()"

      - name: Check the driver folder is admin-owned and read-only for users
        shell: pwsh
        run: |
          $telescope = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Telescope'
          $sid = [System.Security.Principal.SecurityIdentifier]
          $write = [System.Security.AccessControl.FileSystemRights]'Write, Delete, ChangePermissions, TakeOwnership'
          foreach ($item in @(Get-Item -LiteralPath $telescope) + @(Get-ChildItem -LiteralPath $telescope -Recurse -Force)) {
            $acl = Get-Acl -LiteralPath $item.FullName
            $owner = $acl.GetOwner($sid).Value
            if ($owner -ne 'S-1-5-32-544') { throw "$($item.FullName) is owned by $owner" }
            foreach ($rule in $acl.GetAccessRules($true, $true, $sid)) {
              $who = $rule.IdentityReference.Value
              $userish = $who -in @('S-1-5-32-545', 'S-1-5-11', 'S-1-1-0')  # Users, Authenticated Users, Everyone
              if ($userish -and $rule.AccessControlType -eq 'Allow' -and ($rule.FileSystemRights -band $write)) {
                throw "$($item.FullName) lets $who write"
              }
            }
          }
          Write-Host 'Driver folder is admin-owned, users can only read'

      - name: Build the app folder
        working-directory: desktop
        run: pyinstaller telescope.spec

      # release.yml adds Telescope.apk and packs this into Telescope-windows.zip.
      - name: Assemble release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bundle
          Copy-Item -Recurse desktop/dist/TelescopeDesktop/* bundle/
          Copy-Item desktop/THIRD_PARTY_NOTICES.txt bundle/
          Copy-Item -Recurse desktop/platform-tools bundle/platform-tools
          Copy-Item -Recurse desktop/unitycapture bundle/unitycapture

      - name: Verify release bundle
        shell: pwsh
        run: |
          $required = @(
            "bundle/TelescopeDesktop.exe",
            "bundle/THIRD_PARTY_NOTICES.txt",
            "bundle/platform-tools",
            "bundle/unitycapture"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          # The app's libraries, and the Qt plugins it can't start or draw without (tests run from source,
          # so only this notices one PyInstaller left out): the window, SVG icons, GIF wait screens.
          $lib = Get-ChildItem bundle -Directory -Filter "lib-*" | Select-Object -First 1
          if (-not $lib) { $missing += "bundle/lib-<build>" }
          else {
            foreach ($plugin in "platforms/qwindows.dll", "iconengines/qsvgicon.dll",
                                "imageformats/qsvg.dll", "imageformats/qgif.dll") {
              if (-not (Test-Path "$($lib.FullName)/PyQt6/Qt6/plugins/$plugin")) { $missing += $plugin }
            }
          }
          if ($missing) {
            Write-Error "Release bundle is missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Release bundle verified."

      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: bundle/
          retention-days: 7
