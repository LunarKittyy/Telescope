name: Build Windows EXE

# Checks pull requests; release.yml calls it with a build number and channel to make the release bundle.
on:
  pull_request:
    paths: [desktop/**, VERSION, .github/workflows/build-windows.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # A new push to a pull request cancels the check still running for the old one.
    concurrency:
      group: windows-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and PyInstaller
        working-directory: desktop
        run: pip install -r requirements-dev.txt pyinstaller -c constraints.txt

      - name: Run tests
        working-directory: desktop
        run: python -m pytest -q

      - name: Stamp the version
        if: inputs.channel
        working-directory: desktop
        run: python scripts/write_build_info.py --build "${{ inputs.build }}" --channel "${{ inputs.channel }}" --commit "${{ github.sha }}"

      - name: Packaging smoke checks
        working-directory: desktop
        run: python scripts/smoke_check.py

      # Runners are admin with UAC off, so this runs the first-run checklist's Install driver for real: an old
      # app-folder registration, hostile leftovers in Program Files (rejected, their targets untouched), then a clean
      # install that migrates the old one, ignores a redirected %ProgramFiles%, and opens as "Telescope".
      - name: Check the virtual camera driver install
        working-directory: desktop
        shell: pwsh
        run: ./scripts/windows_driver_check.ps1

      - name: Build the app folder
        working-directory: desktop
        run: pyinstaller telescope.spec

      # release.yml adds Telescope.apk and packs this into Telescope-windows.zip.
      - name: Assemble release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bundle
          Copy-Item -Recurse desktop/dist/TelescopeDesktop/* bundle/
          Copy-Item desktop/THIRD_PARTY_NOTICES.txt bundle/
          Copy-Item -Recurse desktop/platform-tools bundle/platform-tools
          Copy-Item -Recurse desktop/unitycapture bundle/unitycapture

      - name: Verify release bundle
        shell: pwsh
        run: |
          $required = @(
            "bundle/TelescopeDesktop.exe",
            "bundle/THIRD_PARTY_NOTICES.txt",
            "bundle/platform-tools",
            "bundle/unitycapture"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          # The app's libraries, and the Qt plugins it can't start or draw without (tests run from source,
          # so only this notices one PyInstaller left out): the window, SVG icons, GIF wait screens.
          $lib = Get-ChildItem bundle -Directory -Filter "lib-*" | Select-Object -First 1
          if (-not $lib) { $missing += "bundle/lib-<build>" }
          else {
            foreach ($plugin in "platforms/qwindows.dll", "iconengines/qsvgicon.dll",
                                "imageformats/qsvg.dll", "imageformats/qgif.dll") {
              if (-not (Test-Path "$($lib.FullName)/PyQt6/Qt6/plugins/$plugin")) { $missing += $plugin }
            }
          }
          if ($missing) {
            Write-Error "Release bundle is missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Release bundle verified."

      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: bundle/
          retention-days: 7
