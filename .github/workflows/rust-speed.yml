name: Rust speed tests

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608
  CARGO_BUILD_WARNINGS: deny

jobs:
  speed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libfontconfig1-dev libxkbcommon-dev \
            fonts-inter fonts-noto-core fonts-noto-cjk libegl1 libgl1 libdbus-1-3

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      - name: Test speed in release
        run: cargo nextest run --release --locked -p telescope-effects -E 'test(four_1080p_streams_draw_quickly)'
