name: Rust parity

# The Rust rewrite's ledger has to list everything the Python desktop app has (rust/parity/README.md).
on:
  pull_request:
    paths:
      - 'rust/**'
      - 'desktop/**'
      - '.github/workflows/rust-parity.yml'
  push:
    branches: [oxidized-telescope]
    paths:
      - 'rust/**'
      - 'desktop/**'
      - '.github/workflows/rust-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    # A new push to a pull request cancels the check still running for the old one.
    concurrency:
      group: rust-parity-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # The inventory builds the desktop app's window offscreen, so it needs what the desktop tests need
      - name: Install the desktop app's dependencies
        working-directory: desktop
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libxkbcommon0 libdbus-1-3
          pip install -r requirements-dev.txt -c constraints.txt
          pip install --no-deps -r requirements-nodeps.txt -c constraints.txt

      - name: Test the parity tools
        run: python -m pytest -q rust/parity/tests

      - name: Check the ledger lists everything
        run: python rust/parity/inventory.py --check

      - name: Report progress
        if: always()
        run: |
          python rust/parity/inventory.py --report | tee report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
