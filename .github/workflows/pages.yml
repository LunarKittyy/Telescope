name: Pages

# Publishes site/ to GitHub Pages whenever it changes on master, on each release, and every 6 hours for the README's badges.
on:
  push:
    branches: [master]
    paths: [site/**, .github/workflows/pages.yml]
  release:
    types: [published]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Release downloads without manifest.json, which every update check fetches, in shields' endpoint format
      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[].assets[] | select(.name != "manifest.json") | .download_count' \
            | jq -s '{schemaVersion: 1, label: "downloads", color: "brightgreen",
                      message: (add // 0 | if . >= 1000 then "\(. / 100 | floor / 10)k" else tostring end)}' \
            > site/downloads.json
          cat site/downloads.json

      # Latest release tag, so the README badge doesn't depend on shields' shared GitHub token pool
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/latest" \
            | jq '{schemaVersion: 1, label: "release", color: "blue", message: .tag_name}' \
            > site/release.json
          cat site/release.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
