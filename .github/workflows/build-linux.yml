name: Build Linux bundle

# Checks pull requests; release.yml calls it with a build number and channel to make the release bundle.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read

jobs:
  # "linux" runs on every pull request so it can be a required check, and skips itself when nothing it covers changed
  changes:
    name: changes (linux)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run || 'true' }}
    steps:
      # A pull request checks out its merge into master, whose first parent is master: the diff is what it changes
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(desktop/|VERSION$|\.github/workflows/build-linux\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    name: linux
    needs: changes
    # Runs unless changes said there's nothing to check, so a changes job that failed doesn't pass this silently
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # A new push to a pull request cancels the check still running for the old one.
    concurrency:
      group: linux-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        working-directory: desktop
        run: |
          # PyQt6 needs these even in QT_QPA_PLATFORM=offscreen mode.
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        working-directory: desktop
        run: python -m pytest -q

      # The release builds the vision packs again (release.yml); this catches a pin that changed without a new
      # vision_pack.json, and runs the real models once.
      - name: Check the vision pack
        if: github.event_name == 'pull_request'
        working-directory: desktop
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
        run: |
          python scripts/build_vision_pack.py --check --install
          TELESCOPE_VISION_PACK=$(ls -d "$XDG_DATA_HOME"/telescope/vision/*/) python -m pytest -q tests/test_vision.py

      - name: Stamp the version
        if: inputs.channel
        working-directory: desktop
        run: python scripts/write_build_info.py --build "${{ inputs.build }}" --channel "${{ inputs.channel }}" --commit "$GITHUB_SHA"

      - name: Packaging smoke checks
        working-directory: desktop
        run: python3 scripts/smoke_check.py

      # release.yml adds Telescope.apk and packs this into Telescope-linux.tar.gz.
      - name: Assemble release bundle
        run: |
          mkdir bundle
          cp desktop/main.py desktop/update_guard.py desktop/requirements.txt desktop/constraints.txt desktop/start.sh bundle/
          cp desktop/THIRD_PARTY_NOTICES.txt bundle/
          cp -r desktop/telescope bundle/telescope
          find bundle -name __pycache__ -type d -prune -exec rm -rf {} +

      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: bundle/
          retention-days: 7
