name: Build Linux bundle

# The Python desktop app's tests and bundle, run by hand. Releases ship the Rust app (rust-package.yml); desktop/ stays for the parity tools.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The oldest Python start.sh accepts, since Linux runs Telescope from source
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        working-directory: desktop
        run: |
          # PyQt6 needs these even in QT_QPA_PLATFORM=offscreen mode, and MediaPipe needs libgles2 too.
          # test_text_fit.py measures texts in Inter, the app's first-choice font, and Hindi in Noto Sans Devanagari.
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libxkbcommon0 libdbus-1-3 fonts-inter fonts-noto-core
          pip install -r requirements-dev.txt -c constraints.txt
          pip install --no-deps -r requirements-nodeps.txt -c constraints.txt

      - name: Run tests
        working-directory: desktop
        run: python -m pytest -q -n auto

      # The release builds the vision packs again (release.yml); this catches a pin that changed without a new
      # vision_pack.json, and runs the real models once.
      - name: Check the vision pack
        working-directory: desktop
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
        run: |
          python scripts/build_vision_pack.py --check --install
          TELESCOPE_VISION_PACK=$(ls -d "$XDG_DATA_HOME"/telescope/vision/*/) python -m pytest -q tests/test_vision.py

      - name: Packaging smoke checks
        working-directory: desktop
        run: python3 scripts/smoke_check.py

      - name: Assemble the bundle
        run: |
          mkdir bundle
          cp desktop/main.py desktop/update_guard.py desktop/requirements.txt desktop/requirements-nodeps.txt desktop/constraints.txt desktop/start.sh bundle/
          cp desktop/THIRD_PARTY_NOTICES.txt bundle/
          cp -r desktop/telescope bundle/telescope
          find bundle -name __pycache__ -type d -prune -exec rm -rf {} +

      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: bundle/
          retention-days: 7
