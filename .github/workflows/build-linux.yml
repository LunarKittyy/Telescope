name: Build Linux bundle

# Checks pull requests; release.yml calls it with a build number and channel to make the release bundle.
on:
  pull_request:
    paths: [desktop/**, VERSION]
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        type: string
        required: true
      channel:
        type: string
        required: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        working-directory: desktop
        run: |
          # PyQt6 needs these even in QT_QPA_PLATFORM=offscreen mode.
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        working-directory: desktop
        run: python -m pytest -q

      - name: Stamp the version
        if: inputs.channel
        working-directory: desktop
        run: python scripts/write_build_info.py --build "${{ inputs.build }}" --channel "${{ inputs.channel }}" --commit "$GITHUB_SHA"

      - name: Packaging smoke checks
        working-directory: desktop
        run: python3 scripts/smoke_check.py

      # release.yml adds Telescope.apk and packs this into Telescope-linux.tar.gz.
      - name: Assemble release bundle
        run: |
          mkdir bundle
          cp desktop/main.py desktop/requirements.txt desktop/constraints.txt desktop/start.sh bundle/
          cp desktop/THIRD_PARTY_NOTICES.txt bundle/
          cp -r desktop/telescope bundle/telescope
          find bundle -name __pycache__ -type d -prune -exec rm -rf {} +

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: bundle/
          retention-days: 7
