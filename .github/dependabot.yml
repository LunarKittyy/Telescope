version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: fontique
      - dependency-name: skrifa
      - dependency-name: harfrust
      # Follows the FFmpeg version build_ffmpeg.sh builds
      - dependency-name: ffmpeg-sys-next
        update-types: ["version-update:semver-major"]
