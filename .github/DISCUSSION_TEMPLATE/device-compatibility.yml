title: "[Device] "
labels: [device-report]
body:
  - type: markdown
    attributes:
      value: |
        This fills a row in [the device compatibility list](https://github.com/LunarKittyy/Telescope/blob/master/docs/device-compatibility.md). Anything you didn't try, leave as `-`. If something is broken, a separate [bug report](https://github.com/LunarKittyy/Telescope/issues/new?template=bug.yml) with the details is even better.

  - type: textarea
    id: phone-diagnostics
    attributes:
      label: Phone diagnostics
      description: In the Telescope app on the phone, open About and tap **Copy diagnostics**, then paste it here. It lists the phone's lenses and what each one can do, which fills in most of the row. If you can't get it, write the phone model, Android version and app version.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: desktop-os
    attributes:
      label: Computer
      description: The ones you tested with.
      options:
        - label: Windows
        - label: Linux

  - type: textarea
    id: results
    attributes:
      label: What worked
      description: "`OK` worked, `PARTIAL` worked with caveats (add a note), `FAIL` didn't work, `-` didn't try."
      value: |
        Lenses (each one in the picker changes the picture, and name any lens the phone has that's missing): -
        Zoom on the Auto lens (switches to the telephoto when zoomed in): -
        Highest frame rate that streamed smoothly: -
        Manual ISO / shutter, white balance and focus: -
        Light format (H.264): -
        Photos card (saves a photo, and is RAW in the Format list?): -
        Microphone: -
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Anything odd, or details on a PARTIAL.
